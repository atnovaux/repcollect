# repkit/tool_defaults.conf
# ---------------------------
# Default flags applied by every wrapper before "$@".  Operator-supplied flags
# override these (because they appear *after* the defaults on the command line).
#
# Edit values here to tune rate limits / OPSEC for an engagement.  No wrapper
# code changes needed — wrappers source this file at startup.
#
# Format: bash arrays.  Use parens around values, quote values with spaces.

# ── Active vulnerability scanning ─────────────────────────────────────────
# nuclei: rate-limit, concurrency, bulk size, timeout, stats line.
#   -duc        skips the auto update-check on every run.
#   -severity   filters to actionable findings only (critical + high).
#               operators run medium/low manually as a follow-up pass:
#                 nuclei -l <urls> -severity medium,low
#               or remove the -severity arg below for a full-catalog scan.
NUCLEI_DEFAULTS=(-rl 150 -c 25 -bs 25 -timeout 10 -stats -duc -severity critical,high)

# ── Active port / service ─────────────────────────────────────────────────
# naabu: 1000 rps is fine on /16; lower for small scopes.  Warm-up time
#        prevents resolver-slamming spikes when starting a scan.
NAABU_DEFAULTS=(-rate 1000 -c 25 -warm-up-time 2)

# nmap: no rate-limit defaults — service-id passes are slow by nature.
NMAP_DEFAULTS=()

# ── Web probing ───────────────────────────────────────────────────────────
# httpx: matches nuclei pacing so rate-limit trips happen at the same point.
HTTPX_DEFAULTS=(-rl 150 -threads 50 -timeout 10 -retries 1)

# ── Web crawl / fuzz ──────────────────────────────────────────────────────
# katana: depth 3 keeps spider sessions bounded.
KATANA_DEFAULTS=(-rl 150 -c 10 -d 3)

# ffuf: default unlimited rate; this is the WAF-trip tool, throttle hard.
FFUF_DEFAULTS=(-rate 50 -t 40)

# ── DNS / passive ─────────────────────────────────────────────────────────
# dnsx: no target-side traffic — hits public resolvers.  No rate limit.
DNSX_DEFAULTS=()

# urlfinder, uncover, dnstwist: third-party APIs only, no rate-limit needed.
URLFINDER_DEFAULTS=()
UNCOVER_DEFAULTS=()
DNSTWIST_DEFAULTS=()

# ── Other tools ───────────────────────────────────────────────────────────
GOWITNESS_DEFAULTS=()
DIG_DEFAULTS=()
TRUFFLEHOG_DEFAULTS=()
S3SCANNER_DEFAULTS=()
