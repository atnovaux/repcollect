# repkit tools.conf
# format: <method>:<value>
# methods: apt, git, pip, go, manual

# ── Recon / OSINT ──────────────────────────────────────────────────────────
git:https://github.com/atnovaux/canvass.git
git:https://github.com/trufflesecurity/trufflehog.git
go:github.com/projectdiscovery/uncover/cmd/uncover
git:https://github.com/elceef/dnstwist.git

# ── Cloud discovery / identity ────────────────────────────────────────────
# cloud_enum: deep keyword-mutation brute force across AWS/Azure/GCP.
# Catches obscure bucket names canvass's narrower mutation set misses.
git:https://github.com/initstring/cloud_enum

# Manual-only (auth-gated / specific-bucket testing):
pip:roadtools
git:https://github.com/sa7mon/S3Scanner.git

# ── DNS ────────────────────────────────────────────────────────────────────
apt:bind9-dnsutils
go:github.com/projectdiscovery/dnsx/cmd/dnsx

# ── Active Scanning ────────────────────────────────────────────────────────
apt:nmap
go:github.com/projectdiscovery/naabu/v2/cmd/naabu
go:github.com/projectdiscovery/httpx/cmd/httpx
go:github.com/sensepost/gowitness

# ── Web Discovery / Crawl ──────────────────────────────────────────────────
go:github.com/projectdiscovery/urlfinder/cmd/urlfinder
go:github.com/projectdiscovery/katana/cmd/katana
go:github.com/ffuf/ffuf/v2
apt:seclists

# ── Active Vulnerability Scanning ──────────────────────────────────────────
go:github.com/projectdiscovery/nuclei/v3/cmd/nuclei

# ── Evidence rendering (audit log → terminal-style PNG screenshots) ───────
# aha converts ANSI-colored terminal output to inline-styled HTML.
# chromium is already present on Kali; used headless to render HTML → PNG.
apt:aha
apt:chromium

# ── User Enum & Password Spray (manual) ───────────────────────────────────
git:https://github.com/Flangvik/TeamFiltration
